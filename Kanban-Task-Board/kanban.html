<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban-Task-Board</title>
    <link rel="stylesheet" href="kanban.css">
</head>
<body>
    <div class="container">
        <h1>Kanban Task Board</h1>
        <div id="taskForm">
            <input type="text" id="taskTitle" placeholder="Enter Task Title">
            <br>
            <textarea name="description" id="description" rows="3" placeholder="Type your description..."></textarea>
            <br>
            <button id="addBtn">Add Task</button>
        </div>
        <div id="board">
            <div id="toDoColumn">
                <h2>To Do</h2>
                <div id="taskList"></div>
            </div>
            <div id="progressColumn">
                <h2>In Progress</h2>
                <div id="pTaskList"></div>
            </div>
            <div id="completedColumn">
                <h2>Completed</h2>
                <div id="cTaskList"></div>
            </div>
        </div>
    </div>
    <script src="kanban.js"></script>
</body>
</html>
